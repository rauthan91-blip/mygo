<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ऑनलाइन शासनादेश</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="header-content">
        <h1>ऑनलाइन शासनादेश </h1>
        <p>Government Orders – ऑनलाइन शासनादेश</p>
    </div>
</header>

<main class="container">

    <section class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="GO का नाम / विषय / वर्ष खोजें..."
        >

        <select id="yearFilter">
            <option value="">सभी वर्ष</option>
        </select>

        <button onclick="loadGOs()">↻ Refresh</button>

    </section>

    <div class="info">
        <span>कुल GO : <b id="totalGO">0</b></span>
    </div>

    <section id="loading" class="loading">
        GO Loading...
    </section>

    <section id="goList" class="go-list"></section>

    <section id="noData" class="no-data" style="display:none;">
        कोई GO उपलब्ध नहीं है।
    </section>

</main>

<footer>
    <p>© 2026 GO Online Portal</p>
</footer>

<script src="script.js"></script>

</body>
</html>
