<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Government Order Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<section class="admin-section">

    <div class="container">

        <h2>➕ Add New Government Order</h2>

        <form id="goForm">

            <input 
                type="text"
                id="goNumber"
                placeholder="GO Number"
                required
            >

            <input 
                type="date"
                id="goDate"
                required
            >

            <input 
                type="text"
                id="department"
                placeholder="Department"
                required
            >

            <input 
                type="text"
                id="subject"
                placeholder="GO Subject"
                required
            >

            <input 
                type="text"
                id="pdfName"
                placeholder="PDF File Name जैसे GO-004.pdf"
                required
            >

            <button type="submit">
                Add GO
            </button>

        </form>

    </div>

</section>
    <header class="header">
        <div class="container">
            <h1>Government Order Portal</h1>
            <p>शासकीय आदेश / Government Orders</p>
        </div>
    </header>


    <section class="search-section">
        <div class="container">

            <input 
                type="text" 
                id="searchInput"
                placeholder="GO Number या Subject खोजें..."
            >

        </div>
    </section>


    <main class="container">

        <h2>Government Orders</h2>

        <div id="goList" class="go-list">

            <!-- GO JavaScript से यहाँ आएंगे -->

        </div>

    </main>


    <footer>
        <p>© 2026 Government Order Portal</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
